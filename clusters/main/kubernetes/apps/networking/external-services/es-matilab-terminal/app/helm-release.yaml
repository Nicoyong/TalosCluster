apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: es-matilab-terminal
  namespace: external-services
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 17.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  
  values:
    service:
      main:
        enabled: true
        externalIP: ${PORTAINER_IP}
        
        useSlice: false
        ports:
          main:
            enabled: true
            port: ${PORTAINER_MATILAB_TERMINAL_PORT}
            protocol: http
        type: ExternalIP

    ingress:
      main:
        enabled: true
        ingressClassName: external

        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

        hosts:
          - host: matilab.${DOMAIN_0}
            paths:
            - path: /
              pathType: Prefix

        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_0}"
