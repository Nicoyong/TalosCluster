apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: sonarr
      version: 26.10.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m  
  timeout: 20m
  maxHistory: 3 
  driftDetection:
    mode: warn   
  install:
    createNamespace: true

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "${S3_URL}"
        bucket: "taloscluster"
        accessKey: "${S3_ACCESKEY}"
        secretKey: "${S3_SECRETKEY}"
        encrKey: "${S3_ENCRKEY}" 
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: sonarr.${DOMAIN_0}
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_0}"  
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            name: "sonarr"
            description: "Sonarr Client"
            group: "Media"
            weight: 2
            widget:
              enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SONARR__AUTH__METHOD: External
          
    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
      downloads:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: ${QBITTORRENT_PATH}
        mountPath: /downloads
      media:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: ${JELLYFIN_NFS_PATH}
        mountPath: /media                      