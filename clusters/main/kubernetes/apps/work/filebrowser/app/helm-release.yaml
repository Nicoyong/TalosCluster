apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
  namespace: filebrowser

spec:
  interval: 15m

  chart:
    spec:
      chart: filebrowser
      version: 13.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system

  maxHistory: 10

  driftDetection:
    mode: warn

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  timeout: 20m

  values:

    global:
      stopAll: false

    # 🔑 S3 UNIQUE
    credentials:
      minio:
        type: s3
        url: "${S3_URL}"
        bucket: "taloscluster"
        accessKey: "${S3_ACCESKEY}"
        secretKey: "${S3_SECRETKEY}"
        encrKey: "${S3_ENCRKEY}"

    # 🌐 INGRESS
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: file.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

    persistence:

      config:
        enabled: true
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true

      database:
        enabled: true
        mountPath: /database
        volsync:
          - name: database
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true

      media:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: ${FILEBROWSER_MEDIA_PATH}
        mountPath: /data/Media

      downloads:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: ${QBITTORRENT_PATH}
        mountPath: /data/Downloads